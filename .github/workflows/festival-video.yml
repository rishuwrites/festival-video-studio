name: Festival explainer video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Festival or observance to explain
        type: string
        required: true
      date:
        description: Optional date/year, for example 2026
        type: string
        required: false
        default: ""
      scope:
        description: India-wide coverage, with special attention to UP and Bihar
        type: string
        required: false
        default: India (nationwide, with focus on Uttar Pradesh and Bihar)
      publish_date:
        description: YouTube scheduled publish date (YYYY-MM-DD, India Standard Time)
        type: string
        required: false
        default: ""
      publish_time:
        description: YouTube scheduled publish time (24-hour HH:MM, India Standard Time)
        type: string
        required: false
        default: ""
      research_context:
        description: Pre-researched, sourced JSON calendar notes (set by the daily scheduler)
        type: string
        required: false
        default: ""
      upload:
        description: Upload and schedule the video for public release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: festival-video-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      PYTHONUNBUFFERED: "1"
      FESTIVAL_TOPIC: ${{ inputs.topic }}
      FESTIVAL_DATE: ${{ inputs.date }}
      FESTIVAL_SCOPE: ${{ inputs.scope || 'India (nationwide, with focus on Uttar Pradesh and Bihar)' }}
      FESTIVAL_PUBLISH_DATE: ${{ inputs.publish_date }}
      FESTIVAL_PUBLISH_TIME: ${{ inputs.publish_time }}
      FESTIVAL_RESEARCH_CONTEXT: ${{ inputs.research_context }}
      YOUTUBE_UPLOAD: ${{ inputs.upload }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      HF_FLUX_SPACE: ${{ vars.HF_FLUX_SPACE || 'https://black-forest-labs-flux-1-schnell.hf.space' }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -c "import PIL.features; assert PIL.features.check('raqm'), 'Pillow RAQM support is required for Hindi text rendering'"
          python -c "import sys; sys.path.insert(0, 'recap'); import render; print('Using Devanagari font:', render.find_font())"

      - name: Research and render video
        run: python recap/festival_main.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: festival-video-${{ github.run_id }}
          path: output/festival_*
          retention-days: 7
          if-no-files-found: ignore
