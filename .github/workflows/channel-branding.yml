name: Update YouTube channel branding

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Confirm that this will update the authenticated channel description and keywords
        type: boolean
        required: true
        default: false
      description:
        description: Channel description (up to 1,000 characters)
        type: string
        required: true
        default: "भारत के त्योहारों, व्रतों और सांस्कृतिक परंपराओं को सरल हिंदी में जानिए। यहाँ आपको प्रमुख पर्वों की तिथि, इतिहास, महत्व, रीति-रिवाज और भारत के अलग-अलग क्षेत्रों की परंपराओं पर स्रोत-आधारित वीडियो मिलेंगे। पंचांग की तिथियाँ और मुहूर्त स्थान के अनुसार बदल सकते हैं; अपने शहर के विश्वसनीय पंचांग से पुष्टि करें।"
      keywords:
        description: Comma-separated channel keywords (up to 500 characters total)
        type: string
        required: true
        default: "भारतीय त्योहार, हिंदी त्योहार, भारत की संस्कृति, हिंदू त्योहार, पूजा परंपरा, व्रत त्योहार, छठ पूजा, दिवाली, होली, त्योहार की तिथि, festival India, Indian festivals, Hindu festivals, Hindi festival videos, Indian culture"

permissions:
  contents: read

jobs:
  update-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONFIRM_CHANNEL_BRANDING: ${{ inputs.confirm }}
      CHANNEL_DESCRIPTION: ${{ inputs.description }}
      CHANNEL_KEYWORDS: ${{ inputs.keywords }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependency
        run: python -m pip install requests

      - name: Update authenticated YouTube channel
        run: python recap/channel_branding.py
